[project]
name = "oplus-ota"
version = "0.1.0"
description = "Query and download OPPO/OnePlus/realme OTA packages"
authors = [{name = "Reza Jelveh", email = "agent@jelveh.me"}]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "cryptography>=43",
    "questionary>=2",
]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["oppo", "oneplus", "realme", "ota", "firmware", "coloros", "oxygenos"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Packaging",
]

[project.urls]
Homepage = "https://github.com/fishing-agents/oplus-ota"
Issues = "https://github.com/fishing-agents/oplus-ota/issues"

[project.scripts]
oplus-ota = "oplus_ota.cli:app"

[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 140
target-version = "py311"
